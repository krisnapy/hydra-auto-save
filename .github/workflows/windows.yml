name: Windows installer

on:
  push:
    branches: [main]
    # Ordinary source changes use the quick workflow. Changes to packaging itself
    # also exercise both distributables and the downstream portable verification.
    paths:
      - '.github/workflows/windows.yml'
      - '.github/workflows/windows-build.yml'
      - 'integration/windows-builder.cjs'
      - 'scripts/build-windows.mjs'
      - 'scripts/audit-windows-package.mjs'
  workflow_dispatch:
    inputs:
      compression:
        description: 'normal untuk distribusi; store untuk membandingkan waktu dan ukuran'
        type: choice
        options: [normal, store]
        default: normal

permissions:
  contents: read

jobs:
  installer:
    uses: ./.github/workflows/windows-build.yml
    with:
      mode: installer
      compression: ${{ inputs.compression || 'normal' }}
    secrets:
      HYDRA_ONEDRIVE_CLIENT_ID: ${{ secrets.HYDRA_ONEDRIVE_CLIENT_ID }}
