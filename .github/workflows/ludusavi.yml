name: Ludusavi detection regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ludusavi.yml'
      - 'scripts/check-ludusavi.mjs'
      - 'module/ludusavi.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
      - name: Get official Ludusavi version bundled with Hydra 4.3.0
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/mtkennerly/ludusavi/releases/download/v0.29.0/ludusavi-v0.29.0-win64.zip -OutFile ludusavi.zip
          Expand-Archive ludusavi.zip -DestinationPath ludusavi
      - name: Reproduce original timeout, test fix, and check reported IDs
        run: node scripts/check-ludusavi.mjs ludusavi/ludusavi.exe --live-manifest
      - name: Check corrected Steam ID 1245620 against current manifest
        shell: pwsh
        run: |
          $diagnosticConfig = Join-Path $env:RUNNER_TEMP 'ludusavi-corrected-id'
          New-Item -ItemType Directory -Force $diagnosticConfig | Out-Null
          & ./ludusavi/ludusavi.exe --config $diagnosticConfig manifest update
          if ($LASTEXITCODE -ne 0) { throw 'Manifest update failed' }
          '' | & ./ludusavi/ludusavi.exe --config $diagnosticConfig --no-manifest-update find --api --backup --steam-id 1245620
          if ($LASTEXITCODE -ne 0) { throw 'Corrected Steam ID was not recognized' }
