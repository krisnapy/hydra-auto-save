name: Verify public Windows downloads

on:
  push:
    branches: [main]
    paths: ['.github/workflows/split-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
      - name: Verify anonymous release downloads
        uses: actions/github-script@v7
        with:
          script: |
            const verify = require('./scripts/verify-public-download.cjs');
            const {version} = require('./package.json');
            const {data: release} = await github.rest.repos.getReleaseByTag({...context.repo, tag: `v${version}`});
            if (release.draft || release.assets.length !== 4) throw new Error('Release incomplete');
            for (const asset of release.assets) {
              if (asset.state !== 'uploaded' || !/^sha256:[a-f0-9]{64}$/.test(asset.digest)) throw new Error('Invalid published asset');
              await verify(asset, {log: message => core.info(message)});
            }
