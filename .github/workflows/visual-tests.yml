name: Game page visual tests

on:
  push:
    branches: [main]
    paths:
      - 'tests/visual/**'
      - '.github/workflows/visual-tests.yml'
      - 'integration/overlay/src/renderer/src/components/personal-cloud-backup*'
  workflow_run:
    workflows: [Windows installer]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: game-visual-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  visual:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/visual/package-lock.json
      - name: Install isolated visual test dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix tests/visual --ignore-scripts
          npx --prefix tests/visual playwright install chromium
      - name: Test six panel states at two window sizes
        run: npx --prefix tests/visual playwright test -c tests/visual/playwright.config.mjs
      # The native page uses the package from the successful build that triggered this run.
      # Push/manual runs cover the current browser component without an old native package.
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run'
        with:
          name: Hydra-Personal-Backup-Windows-x64
          path: package
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify package and test the real Windows game page
        if: github.event_name == 'workflow_run'
        env:
          TESTED_BUILD_RUN: ${{ github.event.workflow_run.id }}
          TESTED_SOURCE: ${{ github.event.workflow_run.head_sha }}
        shell: pwsh
        run: |
          Get-Content package/SHA256SUMS.txt | ForEach-Object {
            $hash, $file = $_ -split '  ', 2
            $actual = (Get-FileHash (Join-Path package $file) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $hash) { throw "Checksum mismatch: $file" }
          }
          $portable = (Get-ChildItem package/*-portable.exe).FullName
          if (!$portable) { throw 'Portable application is missing' }
          node tests/visual/windows-game-page.mjs $portable
          if ($LASTEXITCODE -ne 0) { throw 'Windows game page visual test failed' }
      - name: Create screenshot gallery
        if: always()
        run: node tests/visual/gallery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Game-page-visual-report
          path: visual-results/
          if-no-files-found: error
          retention-days: 30
